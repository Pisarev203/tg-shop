<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071117">
  <title>ОБЛАКО БОТ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:#05090c; --bg-soft:#0b171e; --card:#111c24; --card-2:#17242e;
      --text:#f4f8fb; --muted:#94a7b2; --line:#22343f; --blue:#2aabee;
      --blue-2:#119bdc; --danger:#ff5f6d; --ok:#44d492; --radius:22px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:radial-gradient(circle at 0 0,#0e2b38 0,transparent 35%),radial-gradient(circle at 100% 45%,#0a1d25 0,transparent 35%),var(--bg)}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    .app{min-height:100vh;max-width:720px;margin:0 auto;padding-bottom:calc(92px + var(--safe-bottom))}
    .topbar{position:sticky;top:0;z-index:20;padding:12px 16px 10px;background:linear-gradient(180deg,rgba(5,9,12,.98),rgba(5,9,12,.86),transparent);backdrop-filter:blur(16px)}
    .brand-row{height:42px;display:flex;align-items:center;justify-content:center;position:relative}
    .brand-title{font-size:20px;font-weight:900;letter-spacing:.03em}
    .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px var(--blue);display:inline-block;margin-right:8px}
    .search{display:flex;align-items:center;gap:10px;margin-top:9px;padding:0 15px;height:50px;background:var(--card-2);border:1px solid rgba(255,255,255,.03);border-radius:18px;color:var(--muted)}
    .search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}
    .search input::placeholder{color:#7f929e}
    .view{display:none;padding:5px 16px 20px}.view.active{display:block}
    .chips{display:flex;gap:9px;overflow:auto;padding:10px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;cursor:pointer}
    .chip.active{background:var(--blue);border-color:var(--blue);color:#06131a;font-weight:800}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin:11px 0 15px;gap:10px}
    .section-label{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .sort-btn{border:1px solid var(--line);background:var(--card);padding:10px 13px;border-radius:14px;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .product{min-width:0;display:flex;flex-direction:column}
    .product-media{aspect-ratio:1/1;position:relative;background:linear-gradient(145deg,#1b2b35,#0d151b);border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.04);cursor:pointer}
    .product-media img{width:100%;height:100%;object-fit:cover;display:block}
    .image-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#58707d;font-size:42px;font-weight:900}
    .badge{position:absolute;left:9px;top:9px;background:rgba(5,9,12,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);padding:5px 8px;border-radius:9px;font-size:10px;font-weight:800;max-width:calc(100% - 18px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .product-name{font-weight:800;margin-top:9px;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .product-price{font-weight:900;font-size:18px;margin:5px 0 9px}
    .add-btn,.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#06131a;font-weight:900;border-radius:15px;min-height:44px;padding:10px 12px;cursor:pointer}
    .add-btn:active,.primary:active{transform:scale(.98)}
    .empty{padding:70px 20px;text-align:center;color:var(--muted)}
    .empty-icon{font-size:46px;margin-bottom:12px;filter:grayscale(1)}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 0 16px}
    .page-head h1{font-size:27px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted)}
    .ghost{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 12px;cursor:pointer}
    .cart-list{display:flex;flex-direction:column;gap:10px}
    .cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:18px}
    .cart-thumb{width:70px;height:70px;border-radius:14px;overflow:hidden;background:#1a2730}.cart-thumb img{width:100%;height:100%;object-fit:cover}
    .cart-title{font-weight:800}.cart-variant{font-size:12px;color:var(--muted);margin:3px 0}.cart-price{font-weight:800;margin-top:4px}
    .qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:10px;background:var(--card-2);cursor:pointer}.qty strong{min-width:18px;text-align:center}
    .remove{border:0;background:transparent;color:var(--danger);font-size:18px;cursor:pointer;padding:5px}
    .checkout{margin-top:16px;background:var(--card);border:1px solid var(--line);padding:16px;border-radius:22px}
    .checkout h2{margin:0 0 14px;font-size:19px}
    .field{margin:11px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 6px}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0b151b;color:var(--text);outline:none;border-radius:14px;padding:12px 13px}
    .field textarea{resize:vertical;min-height:74px}
    .promo-row{display:grid;grid-template-columns:1fr auto;gap:8px}.promo-row button{border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:14px;padding:0 14px;font-weight:800}
    .totals{border-top:1px solid var(--line);padding-top:12px;margin-top:13px}.total-row{display:flex;justify-content:space-between;margin:8px 0;color:var(--muted)}.total-row.final{font-size:22px;color:var(--text);font-weight:900}.discount{color:var(--ok)}
    .checkout .primary{width:100%;min-height:52px;margin-top:12px;font-size:16px}.primary:disabled{opacity:.45;cursor:not-allowed}
    .profile-card{text-align:center;padding:28px 18px 18px}.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#715cff);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;overflow:hidden;border:4px solid #0d171e;box-shadow:0 12px 34px rgba(42,171,238,.2)}.avatar img{width:100%;height:100%;object-fit:cover}
    .profile-name{font-size:25px;font-weight:900}.profile-user{color:var(--muted);margin-top:3px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--line);padding:13px 8px;border-radius:17px;text-align:center}.stat strong{display:block;font-size:19px}.stat span{color:var(--muted);font-size:11px}
    .panel{background:var(--card);border:1px solid var(--line);padding:16px;border-radius:22px;margin:12px 0}.panel h2{font-size:18px;margin:0 0 12px}.panel p{color:var(--muted);line-height:1.45;margin:8px 0}
    .progress{height:9px;border-radius:9px;background:#0b151b;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6d6bff);border-radius:inherit}
    .ref-code{font-size:21px;font-weight:900;letter-spacing:.08em;color:var(--blue)}.ref-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ref-actions button{min-height:43px}
    .order-card{background:#0b151b;border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0}.order-top{display:flex;justify-content:space-between;gap:8px}.order-id{font-weight:900}.order-date{color:var(--muted);font-size:12px}.order-items{color:var(--muted);font-size:13px;margin:8px 0;line-height:1.45}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#1c2a33;font-size:11px;font-weight:800}.status.completed{background:rgba(68,212,146,.15);color:var(--ok)}.status.cancelled{background:rgba(255,95,109,.15);color:var(--danger)}
    .bottom-nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:calc(76px + var(--safe-bottom));padding:8px 22px var(--safe-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(5,9,12,.94);border-top:1px solid var(--line);backdrop-filter:blur(20px)}
    .nav-btn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;position:relative}.nav-btn svg{width:25px;height:25px}.nav-btn.active{color:var(--blue)}.cart-count{position:absolute;top:1px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;display:none;align-items:center;justify-content:center;font-size:10px;font-weight:900}
    .modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;padding-bottom:calc(92px + var(--safe-bottom))}.modal.open{display:block}.modal-inner{max-width:720px;margin:auto;padding:12px 16px}.modal-top{display:flex;justify-content:space-between;align-items:center;height:48px}.back-btn{border:0;background:var(--card-2);border-radius:16px;padding:10px 15px;font-weight:800}.detail-image{width:100%;aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:#14212a;margin-top:8px}.detail-image img{width:100%;height:100%;object-fit:cover}.detail-name{font-size:26px;font-weight:900;margin:20px 0 8px}.detail-price{font-size:28px;font-weight:900}.detail-description{color:var(--muted);line-height:1.55}.variant-title{font-weight:800;margin:22px 0 9px}.variants{display:flex;flex-wrap:wrap;gap:9px}.variant{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer}.variant.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.variant:disabled{opacity:.35}.color-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
    .detail-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 16px calc(10px + var(--safe-bottom));background:rgba(5,9,12,.95);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.detail-qty{background:var(--card-2);border-radius:16px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center}.detail-qty button{height:100%;border:0;background:transparent;font-size:21px}.detail-bottom .primary{min-height:52px}
    .toast{position:fixed;z-index:100;left:50%;bottom:calc(95px + var(--safe-bottom));transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 32px);background:#eaf7ff;color:#071117;border-radius:14px;padding:11px 15px;font-weight:800;opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#ffdce0;color:#5c0a15}
    .loader{display:flex;justify-content:center;padding:80px}.loader:after{content:"";width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product-name{font-size:16px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="brand-row"><div class="brand-title"><span class="brand-dot"></span>ОБЛАКО БОТ</div></div>
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" placeholder="Поиск" autocomplete="off">
      </label>
    </header>

    <main>
      <section class="view active" id="catalogView">
        <div class="chips" id="categoryChips"></div>
        <div class="chips" id="brandChips"></div>
        <div class="toolbar"><span class="section-label" id="productCount">Товары</span><button class="sort-btn" id="sortBtn">⇅ По цене</button></div>
        <div class="grid" id="productGrid"><div class="loader"></div></div>
      </section>

      <section class="view" id="cartView">
        <div class="page-head"><div><h1>Корзина</h1><p id="cartSubtitle">Ваш заказ</p></div><button class="ghost" id="clearCart">Очистить</button></div>
        <div id="cartContent"></div>
      </section>

      <section class="view" id="profileView">
        <div id="profileContent"><div class="loader"></div></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="catalog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Меню</span>
    </button>
    <button class="nav-btn" data-view="cart">
      <span class="cart-count" id="cartCount"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>Корзина</span>
    </button>
    <button class="nav-btn" data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Профиль</span>
    </button>
  </nav>

  <div class="modal" id="productModal">
    <div class="modal-inner">
      <div class="modal-top"><button class="back-btn" id="closeProduct">‹ Назад</button><strong>Карточка товара</strong><span style="width:72px"></span></div>
      <div id="productDetail"></div>
    </div>
    <div class="detail-bottom">
      <div class="detail-qty"><button id="detailMinus">−</button><strong id="detailQty">1</strong><button id="detailPlus">+</button></div>
      <button class="primary" id="detailAdd">Добавить</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); try { if (tg.isVersionAtLeast?.('6.1')) { tg.setHeaderColor('#05090c'); tg.setBackgroundColor('#05090c'); } } catch (_) {} }
    const initData = tg?.initData || '';
    const unsafeUser = tg?.initDataUnsafe?.user || null;
    const refParam = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('ref') || '';
    const CART_KEY = 'msv-shop-cart-v2';
    const state = {
      products: [], categories: [], brands: [], category: 'Все', brand: 'Все', query: '', sort: 'default',
      cart: loadCart(), selectedProduct: null, selectedVariant: null, detailQty: 1,
      quote: null, promoCode: '', profile: null, session: null, currentView: 'catalog', quoteRun: 0
    };
    const $ = (selector) => document.querySelector(selector);
    const money = (value) => `${Number(value || 0).toLocaleString('ru-RU')} ₽`;
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const statusNames = {new:'Новый',confirmed:'Подтверждён',paid:'Оплачен',completed:'Завершён',cancelled:'Отменён'};

    function loadCart() { try { const value = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); return Array.isArray(value) ? value : []; } catch (_) { return []; } }
    function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(state.cart)); updateCartBadge(); }
    function haptic(type='light') { try { if (tg?.isVersionAtLeast?.('6.1')) tg.HapticFeedback?.impactOccurred(type); } catch (_) {} }
    function toast(message, error=false) { const el=$('#toast'); el.textContent=message; el.className=`toast show${error?' error':''}`; clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.className='toast',2600); }
    function imageHtml(url, name) { return url ? `<img src="${esc(url)}" alt="${esc(name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;image-fallback&quot;>☁</div>'">` : '<div class="image-fallback">☁</div>'; }

    async function api(path, options={}) {
      const headers = {'Content-Type':'application/json', ...(options.headers || {})};
      if (initData) headers['X-Telegram-Init-Data'] = initData;
      const response = await fetch(path, {...options, headers});
      let data = null; try { data = await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(data?.detail || data?.error || `Ошибка ${response.status}`);
      return data;
    }

    async function loadCatalog() {
      try {
        const data = await api('/api/v2/catalog');
        state.products = data.products || []; state.categories = data.categories || []; state.brands = data.brands || [];
        syncCartProducts(); renderFilters(); renderProducts();
        if (initData) loadSession().catch(()=>{});
      } catch (error) { $('#productGrid').innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⚠️</div>${esc(error.message)}</div>`; }
    }

    async function loadSession() {
      const data = await api(`/api/v2/session?ref=${encodeURIComponent(refParam)}`);
      state.session = data.customer;
    }

    function syncCartProducts() {
      state.cart = state.cart.filter(item => {
        const product=state.products.find(p=>p.id===item.product_id); if(!product) return false;
        const variant=item.variant_id ? product.variants.find(v=>v.id===item.variant_id) : null;
        item.name=product.name; item.image=variant?.image || product.image; item.variant_name=variant?.name || '';
        item.price=Number(product.price)+(variant?Number(variant.price_delta):0); return !item.variant_id || !!variant;
      }); saveCart();
    }

    function renderFilters() {
      const categoryValues=['Все',...state.categories];
      $('#categoryChips').innerHTML=categoryValues.map(value=>`<button class="chip ${value===state.category?'active':''}" data-category="${esc(value)}">${esc(value)}</button>`).join('');
      const visibleBrands=state.brands.filter(brand=>state.category==='Все'||state.products.some(p=>p.category===state.category&&p.brand===brand));
      if(state.brand!=='Все'&&!visibleBrands.includes(state.brand)) state.brand='Все';
      $('#brandChips').innerHTML=['Все',...visibleBrands].map(value=>`<button class="chip ${value===state.brand?'active':''}" data-brand="${esc(value)}">${value==='Все'?'Все бренды':esc(value)}</button>`).join('');
      $('#brandChips').style.display=visibleBrands.length?'flex':'none';
    }

    function filteredProducts() {
      let products=state.products.filter(p=>(state.category==='Все'||p.category===state.category)&&(state.brand==='Все'||p.brand===state.brand));
      const q=state.query.trim().toLowerCase(); if(q) products=products.filter(p=>[p.name,p.description,p.category,p.brand].join(' ').toLowerCase().includes(q));
      if(state.sort==='asc') products.sort((a,b)=>Number(a.price)-Number(b.price));
      if(state.sort==='desc') products.sort((a,b)=>Number(b.price)-Number(a.price));
      return products;
    }

    function renderProducts() {
      const products=filteredProducts(); $('#productCount').textContent=`${products.length} ${products.length===1?'товар':'товаров'}`;
      $('#sortBtn').textContent=state.sort==='asc'?'↑ Сначала дешевле':state.sort==='desc'?'↓ Сначала дороже':'⇅ По цене';
      $('#productGrid').innerHTML=products.length?products.map(p=>`
        <article class="product">
          <div class="product-media" data-open-product="${p.id}">${imageHtml(p.image,p.name)}${p.category?`<span class="badge">${esc(p.category)}</span>`:''}</div>
          <div class="product-name">${esc(p.name)}</div><div class="product-price">${money(p.price)}</div>
          <button class="add-btn" data-open-product="${p.id}">🛒 Добавить</button>
        </article>`).join(''):'<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔎</div>Ничего не найдено</div>';
    }

    function openProduct(productId) {
      const product=state.products.find(p=>p.id===Number(productId)); if(!product) return;
      state.selectedProduct=product; state.selectedVariant=product.variants.length===1?product.variants[0]:null; state.detailQty=1;
      renderProductDetail(); $('#productModal').classList.add('open'); document.body.style.overflow='hidden'; haptic();
    }
    function closeProduct() { $('#productModal').classList.remove('open'); document.body.style.overflow=''; }
    function renderProductDetail() {
      const p=state.selectedProduct, v=state.selectedVariant; if(!p)return;
      const price=Number(p.price)+(v?Number(v.price_delta):0), image=v?.image||p.image;
      $('#productDetail').innerHTML=`
        <div class="detail-image">${imageHtml(image,p.name)}</div>
        <div class="detail-name">${esc(p.name)}</div><div class="detail-price">${money(price)}</div>
        <p class="detail-description">${esc(p.description||'Описание пока не добавлено.')}</p>
        ${p.variants.length?`<div class="variant-title">Выберите вариант <span style="color:var(--danger)">*</span></div><div class="variants">${p.variants.map(item=>`<button class="variant ${v?.id===item.id?'active':''}" data-variant="${item.id}" ${item.stock===0?'disabled':''}>${item.color?`<i class="color-dot" style="background:${esc(item.color)}"></i>`:''}<span>${esc(item.name)}${item.stock===0?' · нет в наличии':''}</span></button>`).join('')}</div>`:''}`;
      $('#detailQty').textContent=state.detailQty; $('#detailAdd').disabled=p.variants.length&&!v; $('#detailAdd').textContent=(p.variants.length&&!v)?'Выберите вариант':`Добавить · ${money(price*state.detailQty)}`;
    }
    function addSelectedToCart() {
      const p=state.selectedProduct,v=state.selectedVariant; if(!p||(p.variants.length&&!v)) return;
      const key=`${p.id}:${v?.id||0}`, existing=state.cart.find(item=>item.key===key);
      if(existing) existing.qty=Math.min(99,existing.qty+state.detailQty); else state.cart.push({key,product_id:p.id,variant_id:v?.id||null,name:p.name,variant_name:v?.name||'',image:v?.image||p.image,price:Number(p.price)+(v?Number(v.price_delta):0),qty:state.detailQty});
      saveCart(); closeProduct(); toast('Добавлено в корзину'); haptic('medium');
    }

    function updateCartBadge() { const count=state.cart.reduce((sum,item)=>sum+item.qty,0),el=$('#cartCount'); el.textContent=count; el.style.display=count?'flex':'none'; }
    function renderCart() {
      $('#searchBox').style.display='none';
      $('#cartSubtitle').textContent=state.cart.length?`${state.cart.reduce((s,i)=>s+i.qty,0)} позиций`:'Добавьте товары для заказа';
      if(!state.cart.length){ $('#cartContent').innerHTML='<div class="empty"><div class="empty-icon">🛍</div><strong>Корзина пуста</strong><br>Добавьте товары из каталога</div>'; return; }
      $('#cartContent').innerHTML=`<div class="cart-list">${state.cart.map(item=>`
        <div class="cart-item" data-key="${esc(item.key)}"><div class="cart-thumb">${imageHtml(item.image,item.name)}</div><div><div class="cart-title">${esc(item.name)}</div>${item.variant_name?`<div class="cart-variant">${esc(item.variant_name)}</div>`:''}<div class="cart-price">${money(item.price*item.qty)}</div></div><div><button class="remove" data-remove="${esc(item.key)}">×</button><div class="qty"><button data-minus="${esc(item.key)}">−</button><strong>${item.qty}</strong><button data-plus="${esc(item.key)}">+</button></div></div></div>`).join('')}</div>
        <div class="checkout"><h2>Оформление</h2>
          <div class="field"><label>МЕТРО ИЛИ АДРЕС</label><input id="checkoutMetro" placeholder="Например, Таганская"></div>
          <div class="field"><label>УДОБНОЕ ВРЕМЯ</label><input id="checkoutTime" placeholder="Сегодня после 18:00"></div>
          <div class="field"><label>ПРОМОКОД</label><div class="promo-row"><input id="promoInput" value="${esc(state.promoCode)}" placeholder="Введите код"><button id="applyPromo">Применить</button></div></div>
          <div class="field"><label>КОММЕНТАРИЙ</label><textarea id="checkoutComment" placeholder="Пожелания к заказу"></textarea></div>
          <div id="quoteBox">${quoteHtml()}</div><button class="primary" id="checkoutButton" ${initData?'':'disabled'}>${initData?'Оформить заказ':'Откройте магазин в Telegram'}</button>
        </div>`;
      refreshQuote();
    }
    function quoteHtml() {
      const q=state.quote, fallback=state.cart.reduce((sum,item)=>sum+item.price*item.qty,0); if(!q)return `<div class="totals"><div class="total-row final"><span>Итого</span><span>${money(fallback)}</span></div></div>`;
      return `<div class="totals"><div class="total-row"><span>Товары</span><span>${money(q.subtotal)}</span></div>${q.discount_total?`<div class="total-row discount"><span>Скидка</span><span>−${money(q.discount_total)}</span></div>`:''}${q.discount_labels?.map(x=>`<div class="total-row discount" style="font-size:12px"><span>${esc(x)}</span><span></span></div>`).join('')||''}<div class="total-row final"><span>Итого</span><span>${money(q.total)}</span></div></div>`;
    }
    async function refreshQuote(showError=false) {
      if(!state.cart.length)return; const run=++state.quoteRun;
      try { const data=await api('/api/v2/quote',{method:'POST',body:JSON.stringify({items:state.cart,promo_code:state.promoCode})}); if(run!==state.quoteRun)return; state.quote=data; const box=$('#quoteBox'); if(box)box.innerHTML=quoteHtml(); if(showError&&state.promoCode)toast('Промокод применён'); }
      catch(error){if(run!==state.quoteRun)return; state.quote=null; const box=$('#quoteBox'); if(box)box.innerHTML=`<div class="totals"><div style="color:var(--danger)">${esc(error.message)}</div></div>`; if(showError)toast(error.message,true);}
    }
    function changeQty(key,delta) { const item=state.cart.find(x=>x.key===key); if(!item)return; item.qty=Math.max(1,Math.min(99,item.qty+delta)); saveCart(); renderCart(); }
    async function checkout() {
      if(!initData){toast('Откройте магазин внутри Telegram',true);return;} const button=$('#checkoutButton'); button.disabled=true; button.textContent='Оформляем…';
      try { const data=await api('/api/v2/orders',{method:'POST',body:JSON.stringify({items:state.cart,promo_code:state.promoCode,metro:$('#checkoutMetro').value,delivery_time:$('#checkoutTime').value,comment:$('#checkoutComment').value})}); state.cart=[];state.quote=null;state.promoCode='';saveCart();renderCart();toast(`Заказ №${data.order.id} оформлен`);haptic('heavy'); }
      catch(error){toast(error.message,true);button.disabled=false;button.textContent='Оформить заказ';}
    }

    async function renderProfile() {
      $('#searchBox').style.display='none'; const root=$('#profileContent');
      if(!initData){root.innerHTML='<div class="empty"><div class="empty-icon">👤</div><strong>Профиль доступен в Telegram</strong><br>Откройте магазин кнопкой в боте</div>';return;}
      root.innerHTML='<div class="loader"></div>';
      try { state.profile=await api('/api/v2/profile'); const {customer,orders,next_tier,successful_referrals,referral_link}=state.profile; const name=[customer.first_name,customer.last_name].filter(Boolean).join(' ')||'Покупатель'; const initial=(customer.first_name||customer.username||'?')[0].toUpperCase(); const progress=next_tier?Math.min(100,customer.orders_count/next_tier.orders*100):100;
        root.innerHTML=`<div class="profile-card"><div class="avatar">${customer.photo_url?`<img src="${esc(customer.photo_url)}" alt="">`:esc(initial)}</div><div class="profile-name">${esc(name)}</div><div class="profile-user">${customer.username?'@'+esc(customer.username):'Telegram ID '+customer.telegram_id}</div></div>
          <div class="stats"><div class="stat"><strong>${customer.orders_count}</strong><span>покупок</span></div><div class="stat"><strong>${money(customer.total_spent)}</strong><span>потрачено</span></div><div class="stat"><strong>${customer.regular_discount_percent+customer.referral_discount_percent}%</strong><span>скидка</span></div></div>
          <div class="panel"><h2>✨ Лояльность</h2><p>${next_tier?`До скидки ${next_tier.percent}% осталось покупок: ${Math.max(0,next_tier.orders-customer.orders_count)}`:'У вас максимальная скидка постоянного покупателя — 10%'}</p><div class="progress"><i style="width:${progress}%"></i></div>${customer.referral_discount_percent?`<p class="discount">Реферальная скидка: ${customer.referral_discount_percent}%</p>`:''}</div>
          <div class="panel"><h2>🎁 Реферальная система</h2><p>Друг получит 5% на первый заказ, а после его покупки ваша постоянная скидка увеличится на 1% — максимум до 10%.</p><div class="ref-code">${esc(customer.referral_code)}</div><p>Успешных приглашений: ${successful_referrals}</p><div class="ref-actions"><button class="ghost" id="copyReferral">Копировать</button><button class="primary" id="shareReferral">Поделиться</button></div></div>
          <div class="panel"><h2>↩ История покупок</h2>${orders.length?orders.map(order=>{const items=(order.items_json||[]).map(i=>`${esc(i.name)}${i.variant_name?' · '+esc(i.variant_name):''} × ${i.qty}`).join('<br>');return `<div class="order-card"><div class="order-top"><div><div class="order-id">Заказ №${order.id}</div><span class="status ${order.status}">${statusNames[order.status]||esc(order.status)}</span></div><div class="order-date">${new Date(order.created_at+'Z').toLocaleDateString('ru-RU')}</div></div><div class="order-items">${items}</div><strong>${money(order.total)}</strong></div>`}).join(''):'<p>Заказов пока нет.</p>'}</div>`;
        $('#copyReferral')?.addEventListener('click',()=>copyReferral(referral_link||customer.referral_code)); $('#shareReferral')?.addEventListener('click',()=>shareReferral(referral_link||customer.referral_code));
      } catch(error){root.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div>${esc(error.message)}</div>`;}
    }
    async function copyReferral(value){try{await navigator.clipboard.writeText(value);toast('Реферальная ссылка скопирована');haptic();}catch(_){toast('Не удалось скопировать',true);}}
    function shareReferral(value){const text='Заходи в ОБЛАКО БОТ — тебе будет скидка 5% на первый заказ';const url=`https://t.me/share/url?url=${encodeURIComponent(value)}&text=${encodeURIComponent(text)}`;if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank');}

    function switchView(view) {
      state.currentView=view; document.querySelectorAll('.view').forEach(el=>el.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(el=>el.classList.toggle('active',el.dataset.view===view));
      $(`#${view}View`).classList.add('active'); $('#searchBox').style.display=view==='catalog'?'flex':'none'; window.scrollTo(0,0);
      if(view==='cart')renderCart(); if(view==='profile')renderProfile(); haptic();
    }

    document.addEventListener('click',event=>{
      const open=event.target.closest('[data-open-product]'); if(open)openProduct(open.dataset.openProduct);
      const cat=event.target.closest('[data-category]'); if(cat){state.category=cat.dataset.category;state.brand='Все';renderFilters();renderProducts();}
      const brand=event.target.closest('[data-brand]'); if(brand){state.brand=brand.dataset.brand;renderFilters();renderProducts();}
      const variant=event.target.closest('[data-variant]'); if(variant){state.selectedVariant=state.selectedProduct.variants.find(v=>v.id===Number(variant.dataset.variant));renderProductDetail();haptic();}
      const minus=event.target.closest('[data-minus]'); if(minus)changeQty(minus.dataset.minus,-1);
      const plus=event.target.closest('[data-plus]'); if(plus)changeQty(plus.dataset.plus,1);
      const remove=event.target.closest('[data-remove]'); if(remove){state.cart=state.cart.filter(i=>i.key!==remove.dataset.remove);saveCart();renderCart();}
    });
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchView(btn.dataset.view)));
    $('#searchInput').addEventListener('input',event=>{state.query=event.target.value;renderProducts();});
    $('#sortBtn').addEventListener('click',()=>{state.sort=state.sort==='default'?'asc':state.sort==='asc'?'desc':'default';renderProducts();});
    $('#closeProduct').addEventListener('click',closeProduct); $('#detailMinus').addEventListener('click',()=>{state.detailQty=Math.max(1,state.detailQty-1);renderProductDetail();}); $('#detailPlus').addEventListener('click',()=>{state.detailQty=Math.min(99,state.detailQty+1);renderProductDetail();}); $('#detailAdd').addEventListener('click',addSelectedToCart);
    $('#clearCart').addEventListener('click',()=>{if(!state.cart.length)return;state.cart=[];state.quote=null;state.promoCode='';saveCart();renderCart();toast('Корзина очищена');});
    $('#cartView').addEventListener('click',event=>{if(event.target.id==='applyPromo'){state.promoCode=$('#promoInput').value.trim().toUpperCase();refreshQuote(true);}if(event.target.id==='checkoutButton')checkout();});
    window.addEventListener('popstate',()=>{if($('#productModal').classList.contains('open'))closeProduct();});
    updateCartBadge(); loadCatalog();
  </script>
</body>
</html>
